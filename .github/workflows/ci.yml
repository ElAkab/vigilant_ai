# ============================================================
#  CI — Continuous Integration (Intégration Continue)
# ============================================================
#  À chaque push et chaque Pull Request sur main, ce workflow :
#    1. Vérifie le style de code (lint)
#    2. Lance les tests unitaires (test)
#    3. Vérifie le typage TypeScript + build Vite (build)
#  Si l'un échoue → l'icône passe en rouge ❌ sur GitHub.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Lint ─────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run lint
        run: bun run lint

  # ── Job 2 : Tests ────────────────────────────────────────
  test:
    name: Tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun run test
        env:
          MOCK_AI: "true"

  # ── Job 3 : Build (TypeScript + Vite) ────────────────────
  build:
    name: Build (tsc + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run build
        run: bun run build
